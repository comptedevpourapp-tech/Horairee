<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emploi du temps — UMONS</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Verdana, Arial, sans-serif; background: #f4f5f7; color: #222; }
  header { background: #cc2427; color: #fff; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  header h1 { font-size: 17px; margin: 0 10px 0 0; flex: 0 0 auto; }
  select, input[type=text] { padding: 7px 9px; border: none; border-radius: 4px; min-width: 120px; font-size: 13px; }
  #recherche { flex: 0 1 150px; }
  #ressource { flex: 1 1 220px; max-width: 400px; }
  #groupe { flex: 0 1 220px; }
  #groupeRecherche { flex: 0 1 180px; }
  #groupe { flex: 1 1 170px; max-width: 300px; }
  #filtre { width: 150px; }
  #semaineNav { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  button { padding: 7px 13px; border: none; border-radius: 4px; background: #ffffff2b; color: #fff; cursor: pointer; font-size: 13px; }
  button:hover { background: #ffffff45; }
  #titreSemaine { font-weight: bold; font-size: 14px; margin: 0 4px; white-space: nowrap; }
  #badgeSource { font-size: 11px; background: #fff3; padding: 2px 8px; border-radius: 10px; display: none; }
  .controles { width: 100%; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  main { padding: 10px; }
  #legende { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .legende-item { font-size: 11px; background: #fff; border-radius: 10px; padding: 3px 10px 3px 6px;
                  box-shadow: 0 1px 3px #0002; display: flex; align-items: center; gap: 6px; }
  .legende-puce { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  #grille { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px #0002; overflow: hidden; }
  .entete { display: grid; grid-template-columns: 52px repeat(7, 1fr); border-bottom: 2px solid #ddd; }
  .entete div { padding: 8px 4px; text-align: center; font-weight: bold; font-size: 13px; border-left: 1px solid #eee; }
  .entete div:first-child { border-left: none; }
  .entete small { font-weight: normal; color: #777; display: block; }
  .entete .aujourdhui { background: #fff3e0; }
  .corps { position: relative; display: grid; grid-template-columns: 52px repeat(7, 1fr); height: 780px; }
  .colHeures { position: relative; }
  .hLab { position: absolute; right: 6px; font-size: 11px; color: #888; transform: translateY(-50%); }
  .col { position: relative; border-left: 1px solid #eee; }
  .ligne { position: absolute; left: 0; right: 0; height: 1px; background: #f0f0f0; }
  .cours { position: absolute; border-radius: 5px; padding: 4px 5px; font-size: 11px; line-height: 1.3;
           overflow: hidden; z-index: 2; cursor: pointer; border-top: 3px solid #fff8; }
  .cours:hover { z-index: 7; box-shadow: 0 3px 10px #0004; }
  .type { display: inline-block; font-size: 9px; background: #00000022; border-radius: 3px; padding: 0 4px; margin-bottom: 2px; }
  .cours b { display: block; }
  .cours .code { display: inline-block; font-size: 10px; color: #445; background: #ffffffaa; border-radius: 3px; padding: 0 4px; }
  .cours .h { color: #444; }
  .cours .salle { color: #222; font-weight: bold; }
  .cours .ens { color: #555; font-style: italic; }
  .marqueur { position: absolute; height: 2px; background: #cc2427; z-index: 6; pointer-events: none; }
  .marqueur::before { content: ""; position: absolute; left: -5px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: #cc2427; }
  #message { padding: 20px; text-align: center; color: #777; }
  #voile { position: fixed; inset: 0; background: #0007; display: none; z-index: 60; }
  #fiche { position: fixed; z-index: 61; top: 50%; left: 50%; transform: translate(-50%, -50%);
           background: #fff; border-radius: 10px; max-width: 520px; width: calc(100% - 30px);
           max-height: 85vh; overflow: auto; padding: 18px 22px; display: none; box-shadow: 0 10px 40px #0006; }
  #fiche h3 { margin: 4px 0 2px; font-size: 16px; }
  #fiche .code { font-size: 14px; color: #445; }
  #fiche dt { font-size: 11px; color: #888; margin-top: 10px; text-transform: uppercase; }
  #fiche dd { margin: 2px 0 0; font-size: 14px; }
  #fiche .fermer { position: absolute; top: 8px; right: 8px; background: #eee; color: #333; width: 30px; height: 30px;
                   border-radius: 50%; font-size: 15px; padding: 0; }
  .pastilleType { display: inline-block; font-size: 11px; border-radius: 10px; padding: 2px 10px; color: #fff; }
  @media (max-width: 760px) {
    .cours { font-size: 9px; padding: 2px 3px; }
    .entete div { font-size: 10px; padding: 4px 2px; }
    .corps { height: 620px; }
    header h1 { display: none; }
    #groupeRecherche, #recherche { flex: 1 1 100%; }
  }
</style>
</head>
<body>
<header>
  <h1>Emploi du temps — UMONS</h1>
  <select id="categorie" title="Type de ressource">
    <option value="formations" selected>Formations (diplômes)</option>
    <option value="salles">Salles</option>
    <option value="">Toutes les ressources</option>
  </select>
  <input type="text" id="recherche" placeholder="Rechercher…">
  <select id="ressource" title="Choix de la ressource"><option value="">—</option></select>
  <button id="reset" title="Tout réafficher">Réinitialiser</button>
  <div id="semaineNav">
    <button id="prec" title="Semaine précédente">◀</button>
    <span id="titreSemaine"></span>
    <span id="badgeSource"></span>
    <button id="suiv" title="Semaine suivante">▶</button>
    <button id="auj">Cette semaine</button>
  </div>
  <div class="controles">
    <label style="font-size:12px;">Groupe (TP) :</label>
    <select id="groupe" title="Filtrer par groupe de TP"><option value="">Tous les groupes</option></select>
    <input type="text" id="groupeRecherche" placeholder="rechercher votre groupe…">
    <label style="font-size:12px;">Filtre :</label>
    <input type="text" id="filtre" placeholder="ex. Math">
  </div>
  <div class="controles">
    <label style="font-size:12px;" title="Toute l'année est déjà couverte automatiquement pour les formations publiques (catalogue intégré). Ce champ est un secours : colle le lien permanent iCal (bouton iCal de l'interface UMONS) pour une ressource non couverte (ex. horaire de master protégé).">📅 Secours flux iCal (optionnel) :</label>
    <input type="text" id="flux" placeholder="(optionnel) lien permanent iCal — utile uniquement pour une ressource non couverte par le catalogue automatique" style="flex:1 1 380px">
    <button id="fluxOk">Utiliser</button>
    <button id="fluxRaz" title="Revenir au flux public (fenêtre ~3 semaines)">Retirer</button>
  </div>
</header>
<main>
  <div id="legende"></div>
  <div id="grille"></div>
  <div id="message">Chargement…</div>
<div id="archiveInfo" style="font-size:12px;color:#666;margin-top:4px;">📂 Semaines disponibles…</div>
<div id="version" style="font-size:11px;color:#888;margin-top:4px;"></div>
</main>
<div id="voile"></div>
<div id="fiche"></div>
<script>
"use strict";
const HEURE_DEBUT = 7, HEURE_FIN = 20, PX_PAR_HEURE = 60;
const nomsJours = ["lundi","mardi","mercredi","jeudi","vendredi","samedi","dimanche"];
const palette = ["#4a72c9","#3f9e46","#b5622d","#7a4ac9","#c93f6e","#2f8ba0","#a0792f","#456f9e"];
const couleursType = {
  "Cours": "#4a72c9", "Exercices": "#3f9e46", "TP": "#b5622d",
  "Examen": "#c93f6e", "Séminaire": "#7a4ac9", "Conférence": "#2f8ba0", "Réunion": "#888888"
};

let lundi = lundiDe(new Date());
let catalogue = {formations: [], salles: [], groupes: []};

function lundiDe(d) {
  const l = new Date(d);
  l.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  l.setHours(0, 0, 0, 0);
  return l;
}
function fmtDate(d) {
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function topPx(minute) { return (minute - HEURE_DEBUT*60) / 60 * PX_PAR_HEURE; }
function couleur(txt) {
  if (!txt) return palette[0];
  let h = 0;
  for (const ch of txt.toLowerCase()) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return palette[h % palette.length];
}
function fondCouleur(hex) {
  const c = [1, 3, 5].map(i => parseInt(hex.slice(i, i+2), 16));
  return "rgb(" + c.map(x => Math.round(x + (255-x)*0.75)).join(",") + ")";
}
function dureeTexte(e) {
  const min = e.duree_min || 0;
  const h = Math.floor(min/60), m = min % 60;
  return h ? (h + "h" + (m ? String(m).padStart(2,"0") : "")) : (m + " min");
}
function echapper(s) { return (s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function chargerRessources() {
  fetch(new URL("/api/version", location)).then(r => r.json()).then(v => {
    const vcode = (v.version || "inconnue").slice(0, 7);
    const p = document.getElementById("version");
    if (p) p.textContent = "Version du code déployée : " + vcode;
  }).catch(() => {});
  fetch(new URL("/api/semaines", location)).then(r => r.json()).then(s => {
    const p = document.getElementById("archiveInfo");
    if (!p) return;
    if (s.nombre > 0) {
      const fmt = (iso) => new Date(iso + "T00:00:00").toLocaleDateString("fr-BE", {day:"2-digit", month:"2-digit", year:"numeric"});
      p.textContent = "📂 " + s.nombre + " semaine(s) disponible(s), du " + fmt(s.premiere) + " au " + fmt(s.derniere) + " (les semaines antérieures à l'installation n'ont jamais été publiées par UMONS et ne peuvent pas être récupérées).";
      if (s.annuel_pret === false) {
        p.textContent += " ⏳ Passe annuelle en cours : les semaines à venir se remplissent progressivement (comptez quelques minutes après le démarrage du serveur).";
      }
    } else {
      p.textContent = "📂 Aucune semaine archivée pour l'instant.";
    }
  }).catch(() => {});
  fetch(new URL("/api/ressources", location)).then(r => r.json()).then(data => {
    catalogue = {formations: data.formations || [], salles: data.salles || [], groupes: data.groupes || []};
    majListeRessources();
    majListeGroupes();
    if (!catalogue.formations.length && !catalogue.salles.length && !catalogue.groupes.length) {
      document.getElementById("message").textContent =
        "Le serveur n'a encore aucune donnée d'UMONS (liste vide). Il retente automatiquement toutes les 2 minutes — rechargez la page d'ici quelques instants.";
    }
  }).catch(e => {
    document.getElementById("message").textContent = "Impossible de charger la liste des ressources : " + e.message;
  });
}

function majListeRessources() {
  const sel = document.getElementById("ressource");
  const type = document.getElementById("categorie").value;
  const recherche = document.getElementById("recherche").value.trim().toLowerCase();
  const conserve = sel.value;
  sel.innerHTML = "";
  const tete = document.createElement("option");
  tete.value = ""; tete.textContent = (type ? "— Choisir —" : "—");
  sel.appendChild(tete);
  if (type) {
    for (const r of catalogue[type] || []) {
      if (recherche && !r.affichage.toLowerCase().includes(recherche)) continue;
      const o = document.createElement("option");
      o.value = r.valeur; o.textContent = r.affichage;
      sel.appendChild(o);
    }
  }
  if ([...sel.options].some(o => o.value === conserve)) sel.value = conserve;
}

function majListeGroupes() {
  const sel = document.getElementById("groupe");
  const recherche = document.getElementById("groupeRecherche").value.trim().toLowerCase();
  const conserve = sel.value;
  sel.innerHTML = "";
  const tete = document.createElement("option");
  tete.value = ""; tete.textContent = "Tous les groupes";
  sel.appendChild(tete);
  for (const g of catalogue.groupes) {
    if (recherche && !g.toLowerCase().includes(recherche)) continue;
    const o = document.createElement("option");
    o.value = g; o.textContent = g;
    sel.appendChild(o);
  }
  if ([...sel.options].some(o => o.value === conserve)) sel.value = conserve;
}

function lireFlux() {
  try { return (window.localStorage && window.localStorage.getItem("lical")) || ""; }
  catch (e) { return ""; }
}
function ecrireFlux(v) {
  try {
    if (v) window.localStorage.setItem("lical", v);
    else window.localStorage.removeItem("lical");
  } catch (e) {}
}

function charger() {
  const u = new URL("/api/horaires", location);
  const filtre = document.getElementById("filtre").value.trim();
  if (filtre) u.searchParams.set("filtre", filtre);
  const flux = lireFlux();
  if (flux) u.searchParams.set("url", flux);
  const type = document.getElementById("categorie").value;
  const ressource = document.getElementById("ressource").value;
  const groupe = document.getElementById("groupe").value;
  if (type && ressource) {
    u.searchParams.set("type", type === "formations" ? "formation" : "salle");
    u.searchParams.set("ressource", ressource);
  }
  if (groupe) u.searchParams.set("groupe", groupe);
  u.searchParams.set("semaine", fmtDate(lundi));
  document.getElementById("message").textContent = "Chargement…";
  fetch(u).then(r => r.json()).then(data => {
    if (data.erreur) throw new Error(data.erreur);
    afficher(data);
  }).catch(e => {
    document.getElementById("message").textContent = "Erreur : " + e.message;
  });
}

function afficher(data) {
  const ref = new Date(data.semaine + "T00:00:00");
  const jours = nomsJours.map((nom, i) => {
    const d = new Date(ref); d.setDate(ref.getDate() + i);
    return { nom, date: d };
  });
  document.getElementById("titreSemaine").textContent =
    jours[0].date.toLocaleDateString("fr-BE", {day:"2-digit", month:"2-digit"}) + " → " +
    jours[6].date.toLocaleDateString("fr-BE", {day:"2-digit", month:"2-digit", year:"2-digit"});

  const grille = document.getElementById("grille");
  grille.innerHTML =
    '<div class="entete"><div></div>' + jours.map(j => {
      const complet = j.date.toLocaleDateString("fr-BE", {day:"numeric", month:"long", year:"numeric"});
      const pose = fmtDate(j.date) === fmtDate(new Date()) ? " aujourdhui" : "";
      return "<div class='entete-j" + pose + "'>" + j.nom + "<small>" + complet + "</small></div>";
    }).join("") +
    '</div><div class="corps"><div class="colHeures">' +
    Array.from({length: HEURE_FIN - HEURE_DEBUT + 1}, (_, i) =>
      '<div class="hLab" style="top:' + (i*PX_PAR_HEURE) + 'px">' +
      String(HEURE_DEBUT + i).padStart(2,"0") + ":00</div>").join("") +
    "</div>" +
    jours.map(() => '<div class="col"></div>').join("") +
    "</div>";

  const colonnes = grille.querySelectorAll(".col");
  for (const col of colonnes) {
    for (let i = 1; i < HEURE_FIN - HEURE_DEBUT; i++) {
      const l = document.createElement("div");
      l.className = "ligne";
      l.style.top = (i * PX_PAR_HEURE) + "px";
      col.appendChild(l);
    }
  }

  const parJour = [[], [], [], [], [], [], []];
  for (const c of data.cours) parJour[(new Date(c.debut).getDay() + 6) % 7].push(c);

  const legendes = new Map();
  let total = 0;
  for (let j = 0; j < 7; j++) {
    const liste = parJour[j].sort((a, b) => a.debut.localeCompare(b.debut));
    const bornes = liste.map(c => {
      const d = new Date(c.debut), f = new Date(c.fin);
      const mD = Math.max(d.getHours()*60 + d.getMinutes(), HEURE_DEBUT*60);
      const mF = Math.max(Math.min(f.getHours()*60 + f.getMinutes(), HEURE_FIN*60), mD + 15);
      c.mD = mD; c.mF = mF; return c;
    });
    const colonnesLibres = [];
    for (const c of bornes) {
      let idx = colonnesLibres.findIndex(fin => fin <= c.mD);
      if (idx === -1) { colonnesLibres.push(c.mF); idx = colonnesLibres.length - 1; }
      else colonnesLibres[idx] = c.mF;
      c.col = idx;
    }
    let i = 0;
    while (i < bornes.length) {
      let finGroupe = bornes[i].mF, k = i + 1;
      while (k < bornes.length && bornes[k].mD < finGroupe) { finGroupe = Math.max(finGroupe, bornes[k].mF); k++; }
      for (let m = i; m < k; m++) bornes[m].nbCols = Math.max(colonnesLibres.length, 1);
      i = k;
    }
    for (const c of bornes) {
      const el = document.createElement("div");
      el.className = "cours";
      const intitule = c.intitule || (c.matiere.split(" - ")[0] || c.matiere);
      const couleurB = couleur(intitule) ;
      el.style.background = fondCouleur(couleurB);
      el.style.borderLeft = "4px solid " + couleurB;
      el.style.top = topPx(c.mD) + "px";
      el.style.height = Math.max(topPx(c.mF) - topPx(c.mD) - 2, 18) + "px";
      const part = "(100% - 8px) / " + c.nbCols;
      el.style.left = "calc(4px + " + c.col + " * " + part + ")";
      el.style.width = "calc(" + part + ")";
      const ens = c.enseignants && c.enseignants.length ? c.enseignants.join(", ") : "";
      el.innerHTML =
        '<span class="type">' + echapper(c.type || "Cours") + "</span>" +
        "<b>" + echapper(intitule) + "</b>" +
        (c.code ? '<span class="code">' + echapper(c.code) + "</span> " : "") +
        '<span class="h">' + c.debut.slice(11,16) + "–" + c.fin.slice(11,16) + "</span>" +
        (c.duree_min ? ' <span class="h">(' + dureeTexte(c) + ")</span>" : "") +
        (c.salle ? '<span class="salle"> ' + echapper(c.salle.split(",")[0]) + "</span>" : "") +
        (ens ? '<span class="ens"> ' + echapper(ens) + "</span>" : "");
      el.onclick = () => montrerFiche(c, intitule);
      colonnes[j].appendChild(el);
      total++;
      if (!legendes.has(intitule)) legendes.set(intitule, couleurB);
    }
  }

  const legende = document.getElementById("legende");
  legende.innerHTML = "";
  const maxi = 14;
  let n = 0;
  for (const [intitule, col] of legendes) {
    if (n++ >= maxi) break;
    const item = document.createElement("span");
    item.className = "legende-item";
    item.innerHTML = '<span class="legende-puce" style="background:' + col + '"></span>' + echapper(intitule);
    legende.appendChild(item);
  }
  if (legendes.size > maxi) {
    legende.appendChild(document.createTextNode("+" + (legendes.size - maxi) + " autres cours"));
  }

  const maintenant = new Date();
  const idx = (maintenant.getDay() + 6) % 7;
  const minute = maintenant.getHours()*60 + maintenant.getMinutes();
  if (fmtDate(lundiDe(maintenant)) === data.semaine && minute >= HEURE_DEBUT*60 && minute <= HEURE_FIN*60) {
    const m = document.createElement("div");
    m.className = "marqueur";
    m.style.top = topPx(minute) + "px";
    m.style.left = "calc(52px + " + idx + " * (100% - 52px) / 7)";
    m.style.width = "calc((100% - 52px) / 7)";
    grille.querySelector(".corps").appendChild(m);
  }

  const badge = document.getElementById("badgeSource");
  const horsFenetre = data.fenetre && (ref < new Date(data.fenetre.debut + "T00:00:00") || ref > new Date(data.fenetre.fin + "T23:59:59"));
  if (horsFenetre && data.source === "annuel") {
    badge.style.display = "";
    badge.textContent = "📅 année complète (flux annuel)";
  } else if (horsFenetre && data.source === "archive") {
    badge.style.display = "";
    badge.textContent = "📁 semaine archivée";
  } else if (horsFenetre && total === 0) {
    badge.style.display = "";
    badge.textContent = "⛔ jamais publiée";
  } else {
    badge.style.display = "none";
  }
  document.getElementById("message").textContent = total === 0
    ? (horsFenetre
        ? "Aucune donnée enregistrée pour cette semaine (elle n'a jamais été publiée ni capturée ; le serveur UMONS ne publie que ~3 semaines glissantes — la passe annuelle du serveur la récupérera automatiquement)."
        : "Aucun cours cette semaine pour cette sélection.")
    : "";
}

function montrerFiche(c, intitule) {
  const fiche = document.getElementById("fiche");
  const voile = document.getElementById("voile");
  const ens = c.enseignants && c.enseignants.length ? c.enseignants.join(", ") : "";
  fiche.innerHTML =
    '<button class="fermer" id="fermerFiche">✕</button>' +
    '<span class="pastilleType" style="background:' + (couleursType[c.type] || "#4a72c9") + '">' + echapper(c.type || "Cours") + "</span>" +
    "<h3>" + echapper(intitule) + "</h3>" +
    '<div class="code">' + (c.code ? echapper(c.code) : "code du cours non fourni par l’export") + "</div>" +
    "<dl>" +
    "<dt>Horaire</dt><dd>" + c.debut.slice(11,16) + " – " + c.fin.slice(11,16) +
    (c.duree_min ? " (" + dureeTexte(c) + ")" : "") + "</dd>" +
    "<dt>Date</dt><dd>" + new Date(c.debut).toLocaleDateString("fr-BE", {weekday:"long", day:"numeric", month:"long", year:"numeric"}) + "</dd>" +
    "<dt>Local</dt><dd>" + echapper(c.salle || "—") + "</dd>" +
    (ens ? "<dt>Enseignant(s)</dt><dd>" + echapper(ens) + "</dd>" : "") +
    (c.groupes && c.groupes.length ? "<dt>Groupe(s)</dt><dd>" + echapper(c.groupes.join(", ")) + "</dd>" : "") +
    (c.formations && c.formations.length ? "<dt>Formation(s)</dt><dd>" + echapper(c.formations.map(f => f.replace(/^\\./, "")).join(", ")) + "</dd>" : "") +
    (c.maj ? "<dt>Dernière mise à jour</dt><dd>" + echapper(c.maj) + "</dd>" : "") +
    "</dl>" +
    (c.description ? "<dt>Description d’origine</dt><dd style='white-space:pre-wrap;font-size:12px;color:#555;'>" + echapper(c.description) + "</dd>" : "");
  fiche.style.display = "block";
  voile.style.display = "block";
  document.getElementById("fermerFiche").onclick = fermerFiche;
}
function fermerFiche() {
  document.getElementById("fiche").style.display = "none";
  document.getElementById("voile").style.display = "none";
}
document.addEventListener("keydown", e => { if (e.key === "Escape") fermerFiche(); });
document.getElementById("voile").onclick = fermerFiche;

document.getElementById("categorie").onchange = () => {
  const type = document.getElementById("categorie").value;
  document.getElementById("recherche").style.display = type ? "" : "none";
  document.getElementById("recherche").value = "";
  majListeRessources();
  charger();
};
document.getElementById("ressource").onchange = charger;
document.getElementById("groupe").onchange = charger;
document.getElementById("groupeRecherche").addEventListener("input", majListeGroupes);
document.getElementById("prec").onclick = () => { lundi.setDate(lundi.getDate() - 7); charger(); };
document.getElementById("suiv").onclick = () => { lundi.setDate(lundi.getDate() + 7); charger(); };
document.getElementById("auj").onclick = () => { lundi = lundiDe(new Date()); charger(); };
document.getElementById("reset").onclick = () => {
  document.getElementById("categorie").value = "";
  document.getElementById("recherche").value = "";
  document.getElementById("recherche").style.display = "none";
  document.getElementById("groupeRecherche").value = "";
  document.getElementById("groupe").value = "";
  document.getElementById("filtre").value = "";
  majListeRessources();
  majListeGroupes();
  charger();
};
document.getElementById("filtre").addEventListener("keydown", e => { if (e.key === "Enter") charger(); });

document.getElementById("fluxOk").onclick = () => {
  const v = document.getElementById("flux").value.trim();
  if (!v) { document.getElementById("message").textContent = "Colle d'abord le lien permanent iCal copié depuis l'interface UMONS."; return; }
  ecrireFlux(v);
  charger();
};
document.getElementById("fluxRaz").onclick = () => {
  ecrireFlux("");
  document.getElementById("flux").value = "";
  charger();
};

document.getElementById("flux").value = lireFlux();

chargerRessources();
charger();
</script>
</body>
</html>
