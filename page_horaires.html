<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emploi du temps — UMONS</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Verdana, Arial, sans-serif; background: #f4f5f7; color: #222; }
  header { background: #cc2427; color: #fff; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  header h1 { font-size: 17px; margin: 0 10px 0 0; flex: 0 0 auto; }
  select, input[type=text] { padding: 7px 9px; border: none; border-radius: 4px; min-width: 120px; font-size: 13px; }
  #recherche { flex: 0 1 150px; }
  #ressource { flex: 1 1 220px; max-width: 400px; }
  #groupe { flex: 0 1 220px; }
  #groupeRecherche { flex: 0 1 180px; }
  #groupe { flex: 1 1 170px; max-width: 300px; }
  #filtre { width: 150px; }
  #semaineNav { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  button { padding: 7px 13px; border: none; border-radius: 4px; background: #ffffff2b; color: #fff; cursor: pointer; font-size: 13px; }
  button:hover { background: #ffffff45; }
  #titreSemaine { font-weight: bold; font-size: 14px; margin: 0 4px; white-space: nowrap; }
  #badgeSource { font-size: 11px; background: #fff3; padding: 2px 8px; border-radius: 10px; display: none; }
  .controles { width: 100%; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  main { padding: 10px; }
  #legende { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .legende-item { font-size: 11px; background: #fff; border-radius: 10px; padding: 3px 10px 3px 6px;
                  box-shadow: 0 1px 3px #0002; display: flex; align-items: center; gap: 6px; }
  .legende-puce { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  #grille { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px #0002; overflow: hidden; }
  .horsJours { display: flex; flex-wrap: wrap; gap: 6px; padding: 7px 10px; border-bottom: 1px dashed #e3e3e3; }
  .horsJour { font-size: 12px; background: #eef1f8; color: #44506a; border: 1px solid #d8deee;
              border-radius: 6px; padding: 3px 9px; }
  .entete { display: grid; grid-template-columns: 52px repeat(7, 1fr); border-bottom: 2px solid #ddd; }
  .entete div { padding: 8px 4px; text-align: center; font-weight: bold; font-size: 13px; border-left: 1px solid #eee; }
  .entete div:first-child { border-left: none; }
  .entete small { font-weight: normal; color: #777; display: block; }
  .entete .aujourdhui { background: #fff3e0; }
  .corps { position: relative; display: grid; grid-template-columns: 52px repeat(7, 1fr); height: 780px; }
  .colHeures { position: relative; }
  .hLab { position: absolute; right: 6px; font-size: 11px; color: #888; transform: translateY(-50%); }
  .col { position: relative; border-left: 1px solid #eee; }
  .ligne { position: absolute; left: 0; right: 0; height: 1px; background: #f0f0f0; }
  .cours { position: absolute; border-radius: 5px; padding: 4px 5px; font-size: 11px; line-height: 1.3;
           overflow: hidden; z-index: 2; cursor: pointer; border-top: 3px solid #fff8; }
  .cours:hover { z-index: 7; box-shadow: 0 3px 10px #0004; }
  .typeBas { position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%); display: inline-block; font-size: 9px;
             background: #00000022; border-radius: 3px; padding: 0 4px; max-width: calc(100% - 10px);
             overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* repère rouge sous les évaluations : examen (écrit/oral), exercices côtés */
  .typeBas.repere { background: #c62828; color: #fff; font-weight: bold; }
  .cours b { display: block; }
  .cours .code { display: inline-block; font-size: 10px; color: #445; background: #ffffffaa; border-radius: 3px; padding: 0 4px; }
  .cours .h { color: #444; }
  .cours .salle { color: #222; font-weight: bold; }
  .cours .ens { color: #555; font-style: italic; }
  .cours .memo { display: block; font-size: 9px; font-style: italic; color: #4a3a00;
                 background: #fff3c4aa; border-radius: 3px; padding: 0 4px;
                 max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .marqueur { position: absolute; height: 2px; background: #cc2427; z-index: 6; pointer-events: none; }
  .marqueur::before { content: ""; position: absolute; left: -5px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: #cc2427; }
  #message { padding: 20px; text-align: center; color: #777; }
  #voile { position: fixed; inset: 0; background: #0007; display: none; z-index: 60; }
  #voile.plein { background: #f5f7fb; }
  body.choix header, body.choix main { display: none; }
  #fiche { position: fixed; z-index: 61; top: 50%; left: 50%; transform: translate(-50%, -50%);
           background: #fff; border-radius: 10px; max-width: 520px; width: calc(100% - 30px);
           max-height: 85vh; overflow: auto; padding: 18px 22px; display: none; box-shadow: 0 10px 40px #0006; }
  #fiche h3 { margin: 4px 0 2px; font-size: 16px; }
  #fiche .code { font-size: 14px; color: #445; }
  #fiche dt { font-size: 11px; color: #888; margin-top: 10px; text-transform: uppercase; }
  #fiche dd { margin: 2px 0 0; font-size: 14px; }
  #fiche .fermer { position: absolute; top: 8px; right: 8px; background: #eee; color: #333; width: 30px; height: 30px;
                   border-radius: 50%; font-size: 15px; padding: 0; }
  #accueil { position: fixed; z-index: 62; top: 50%; left: 50%; transform: translate(-50%, -50%);
             background: #fff; border-radius: 10px; max-width: 460px; width: calc(100% - 30px);
             padding: 20px 24px; display: none; box-shadow: 0 10px 40px #0006; }
  body.choix #accueil { box-shadow: none; }
  #accueil h2 { margin: 0 0 6px; font-size: 18px; }
  #accueil label { display: block; font-size: 12px; color: #666; margin: 12px 0 4px; text-transform: uppercase; }
  #accueil select { width: 100%; padding: 7px; border: 1px solid #ccd; border-radius: 6px; font-size: 14px; background: #fff; }
  #accueil .boutons { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
  #accueil button { padding: 8px 14px; border: none; border-radius: 6px; background: #2f6fd6; color: #fff; font-size: 14px; cursor: pointer; }
  #accueil button.second { background: #e3e7ef; color: #333; }
  .pastilleType { display: inline-block; font-size: 11px; border-radius: 10px; padding: 2px 10px; color: #fff; }
  /* Vue année : cartes par mois, une ligne par semaine (nombre de cours) */
  #vueAnnee { display: none; }
  #vueAnnee.actif { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .mois { background: #fff; border: 1px solid #dde3ee; border-radius: 10px; padding: 10px 12px; }
  .mois h4 { margin: 0 0 8px; font-size: 14px; color: #445; text-transform: capitalize; }
  .scan { display: flex; flex-direction: column; gap: 3px; }
  .semCell { display: flex; justify-content: space-between; align-items: center; gap: 6px;
             border: 1px solid #e3e7f2; border-radius: 6px; padding: 3px 8px; font-size: 12px;
             cursor: pointer; background: #fafbfe; }
  .semCell:hover { background: #eef3ff; border-color: #b9c8ee; }
  .semCell.vide { color: #99a3b8; background: #f4f5f8; }
  .semCell.courante { border-color: #2f6fd6; box-shadow: 0 0 0 2px #2f6fd622; font-weight: bold; }
  .semCell .nb { background: #2f6fd6; color: #fff; border-radius: 9px; padding: 1px 7px; font-size: 10px; }
  .semCell.vide .nb { background: #c3cad9; }
  @media (max-width: 760px) {
    .cours { font-size: 9px; padding: 2px 3px; }
    .entete div { font-size: 10px; padding: 4px 2px; }
    .corps { height: 620px; }
    header h1 { display: none; }
    #groupeRecherche, #recherche { flex: 1 1 100%; }
  }
</style>
</head>
<body>
<header>
  <h1>Emploi du temps — UMONS</h1>
  <select id="categorie" title="Type de ressource">
    <option value="formations" selected>Formations (diplômes)</option>
    <option value="salles">Salles</option>
    <option value="">Toutes les ressources</option>
  </select>
  <input type="text" id="recherche" placeholder="Rechercher…">
  <select id="ressource" title="Choix de la ressource"><option value="">—</option></select>
  <button id="reset" title="Tout réafficher">Réinitialiser</button>
  <div id="semaineNav">
    <button id="prec" title="Semaine précédente">◀</button>
    <span id="titreSemaine"></span>
    <span id="badgeSource"></span>
    <button id="suiv" title="Semaine suivante">▶</button>
    <button id="auj">Cette semaine</button>
    <button id="anneeBtn" title="Vue année : toutes les semaines de l'année (faites un dézoom de la page pour l'obtenir automatiquement, cliquez sur une semaine pour y naviguer)">Année</button>
    <button id="changerPref" title="Changer la formation et le groupe mémorisés par défaut">⚙ Options</button>
  </div>
  <div class="controles">
    <label style="font-size:12px;">Groupe (TP) :</label>
    <select id="groupe" title="Filtrer par groupe de TP"><option value="">Tous les groupes</option></select>
    <input type="text" id="groupeRecherche" placeholder="rechercher votre groupe…">
    <label style="font-size:12px;">Filtre :</label>
    <input type="text" id="filtre" placeholder="ex. Math">
  </div>
  <div class="controles">
    <label style="font-size:12px;" title="Toute l'année est déjà couverte automatiquement pour les formations publiques (catalogue intégré). Ce champ est un secours : colle le lien permanent iCal (bouton iCal de l'interface UMONS) pour une ressource non couverte (ex. horaire de master protégé).">📅 Secours flux iCal (optionnel) :</label>
    <input type="text" id="flux" placeholder="(optionnel) lien permanent iCal — utile uniquement pour une ressource non couverte par le catalogue automatique" style="flex:1 1 380px">
    <button id="fluxOk">Utiliser</button>
    <button id="fluxRaz" title="Revenir au flux public (fenêtre ~3 semaines)">Retirer</button>
  </div>
</header>
<main>
  <div id="legende"></div>
  <div id="grille"></div>
  <div id="message">Chargement…</div>
<div id="vueAnnee"></div>
<div id="archiveInfo" style="font-size:12px;color:#666;margin-top:4px;">📂 Semaines disponibles…</div>
<div id="etatPasses" style="font-size:12px;color:#666;margin-top:2px;"></div>
<div id="version" style="font-size:11px;color:#888;margin-top:4px;"></div>
</main>
<div id="voile"></div>
<div id="fiche"></div>
<div id="accueil"></div>
<script>
"use strict";
const HEURE_DEBUT = 7, HEURE_FIN = 20, PX_PAR_HEURE = 60;
const nomsJours = ["lundi","mardi","mercredi","jeudi","vendredi","samedi","dimanche"];
const palette = ["#4a72c9","#3f9e46","#b5622d","#7a4ac9","#c93f6e","#2f8ba0","#a0792f","#456f9e"];
const couleursType = {
  "Cours": "#4a72c9", "Exercices": "#4caf50", "Exercices cotés": "#1b5e20",
  "Cours/Exercices": "#00acc1", "TP": "#b5622d",
  "Projet": "#c2872f", "Examen": "#c93f6e", "Séminaire": "#7a4ac9",
  "Conférence": "#2f8ba0", "Réunion": "#888888", "Stage": "#56a08b",
  "TFE": "#4a9ac9", "Tutorat": "#8a8f3f", "Remédiation": "#f39c12",
  "Visite": "#795548", "Voyage": "#009688", "À distance": "#607d8b",
  "Autre": "#95a5a6"
};

let lundi = lundiDe(new Date());
let catalogue = {formations: [], salles: [], groupes: []};

function lundiDe(d) {
  const l = new Date(d);
  l.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  l.setHours(0, 0, 0, 0);
  return l;
}
function fmtDate(d) {
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function topPx(minute) { return (minute - HEURE_DEBUT*60) / 60 * PX_PAR_HEURE; }
function couleur(txt) {
  if (!txt) return palette[0];
  let h = 0;
  for (const ch of txt.toLowerCase()) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return palette[h % palette.length];
}
function fondCouleur(hex) {
  const c = [1, 3, 5].map(i => parseInt(hex.slice(i, i+2), 16));
  return "rgb(" + c.map(x => Math.round(x + (255-x)*0.75)).join(",") + ")";
}
function dureeTexte(e) {
  const min = e.duree_min || 0;
  const h = Math.floor(min/60), m = min % 60;
  return h ? (h + "h" + (m ? String(m).padStart(2,"0") : "")) : (m + " min");
}
function echapper(s) { return (s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function chargerRessources() {
  fetch(new URL("/api/version", location)).then(r => r.json()).then(v => {
    const vcode = (v.version || "inconnue").slice(0, 7);
    const p = document.getElementById("version");
    if (p) p.textContent = "Version du code déployée : " + vcode;
  }).catch(() => {});
  fetch(new URL("/api/semaines", location)).then(r => r.json()).then(s => {
    const p = document.getElementById("archiveInfo");
    if (!p) return;
    if (s.nombre > 0) {
      const fmt = (iso) => new Date(iso + "T00:00:00").toLocaleDateString("fr-BE", {day:"2-digit", month:"2-digit", year:"numeric"});
      p.textContent = "📂 " + s.nombre + " semaine(s) disponible(s), du " + fmt(s.premiere) + " au " + fmt(s.derniere) + " (les semaines antérieures à l'installation n'ont jamais été publiées par UMONS et ne peuvent pas être récupérées).";
      if (s.annuel_pret === false) {
        p.textContent += " ⏳ Passe annuelle en cours : les semaines à venir se remplissent progressivement (comptez quelques minutes après le démarrage du serveur).";
      }
    } else {
      p.textContent = "📂 Aucune semaine archivée pour l'instant.";
    }
  }).catch(() => {});
  fetch(new URL("/api/etat", location)).then(r => r.json()).then(t => {
    const parts = [];
    const af = t.annuel_formations || {}, ag = t.annuel_groupes || {};
    parts.push(af.pret
      ? "📣 formations en mémoire : " + (af.memoisees || 0) + " ✓"
      : "⏳ passe formations : " + (af.memoisees || 0) + "/" + (af.catalogue || 0) + " en cours");
    parts.push(ag.pret
      ? "groupes en mémoire : " + (ag.memoises || 0) + " ✓"
      : "⏳ passe groupes : " + Math.min(ag.memoises || 0, ag.catalogue || 0) + "/" + (ag.catalogue || 0) + " en cours (comptez ~20 min après un redémarrage)");
    document.getElementById("etatPasses").textContent = "♻ " + parts.join(" · ");
  }).catch(() => {});
  fetch(new URL("/api/ressources", location)).then(r => r.json()).then(data => {
    catalogue = {formations: data.formations || [], salles: data.salles || [], groupes: data.groupes || []};
    majListeRessources();
    majListeGroupes();
    if (!catalogue.formations.length && !catalogue.salles.length && !catalogue.groupes.length) {
      document.getElementById("message").textContent =
        "Le serveur n'a encore aucune donnée d'UMONS (liste vide). Il retente automatiquement toutes les 2 minutes — rechargez la page d'ici quelques instants.";
    }
  }).catch(e => {
    document.getElementById("message").textContent = "Impossible de charger la liste des ressources : " + e.message;
  });
}

function majListeRessources() {
  const sel = document.getElementById("ressource");
  const type = document.getElementById("categorie").value;
  const recherche = document.getElementById("recherche").value.trim().toLowerCase();
  const conserve = sel.value;
  sel.innerHTML = "";
  const tete = document.createElement("option");
  tete.value = ""; tete.textContent = (type ? "— Choisir —" : "—");
  sel.appendChild(tete);
  if (type) {
    for (const r of catalogue[type] || []) {
      if (recherche && !r.affichage.toLowerCase().includes(recherche)) continue;
      const o = document.createElement("option");
      o.value = r.valeur; o.textContent = r.affichage;
      sel.appendChild(o);
    }
  }
  if ([...sel.options].some(o => o.value === conserve)) sel.value = conserve;
}

function majListeGroupes(liste) {
  const sel = document.getElementById("groupe");
  const recherche = document.getElementById("groupeRecherche").value.trim().toLowerCase();
  const conserve = sel.value;
  sel.innerHTML = "";
  const tete = document.createElement("option");
  tete.value = ""; tete.textContent = "Tous les groupes";
  sel.appendChild(tete);
  for (const item of liste || catalogue.groupes) {
    // l'API renvoie soit des chaînes, soit {valeur, affichage} (groupes de TP du catalogue)
    const obj = (item && typeof item === "object") ? item : { valeur: item, affichage: item };
    if (recherche && !obj.valeur.toLowerCase().includes(recherche)
        && !(obj.affichage || "").toLowerCase().includes(recherche)) continue;
    const o = document.createElement("option");
    o.value = obj.valeur; o.textContent = obj.affichage;
    sel.appendChild(o);
  }
  if ([...sel.options].some(o => o.value === conserve)) sel.value = conserve;
}

async function majGroupesPourRessource() {
  // avec une sélection de formation, l'API renvoie les groupes de CETTE
  // formation (y compris les TP récoltés, ex. .BAB2 - Ir. civil -> 01…12, A…D)
  // (valeur du select catégorie au pluriel : formations / salles)
  const type = document.getElementById("categorie").value;
  const ressource = document.getElementById("ressource").value;
  if (type === "formations" && ressource) {
    try {
      const r = await fetch(new URL("/api/ressources?type=formation&ressource=" + encodeURIComponent(ressource), location));
      const data = await r.json();
      if (data.groupes && data.groupes.length) {
        majListeGroupes(data.groupes);
        return;
      }
    } catch (e) { /* repli sur la liste globale */ }
  }
  majListeGroupes();
}

function lireFlux() {
  try { return (window.localStorage && window.localStorage.getItem("lical")) || ""; }
  catch (e) { return ""; }
}
function ecrireFlux(v) {
  try {
    if (v) window.localStorage.setItem("lical", v);
    else window.localStorage.removeItem("lical");
  } catch (e) {}
}

function charger() {
  const u = new URL("/api/horaires", location);
  const filtre = document.getElementById("filtre").value.trim();
  if (filtre) u.searchParams.set("filtre", filtre);
  const flux = lireFlux();
  if (flux) u.searchParams.set("url", flux);
  const type = document.getElementById("categorie").value;
  const ressource = document.getElementById("ressource").value;
  const groupe = document.getElementById("groupe").value;
  if (type && ressource) {
    u.searchParams.set("type", type === "formations" ? "formation" : "salle");
    u.searchParams.set("ressource", ressource);
  }
  if (groupe) u.searchParams.set("groupe", groupe);
  u.searchParams.set("semaine", fmtDate(lundi));
  document.getElementById("message").textContent = "Chargement…";
  fetch(u).then(r => r.json()).then(data => {
    if (data.erreur) throw new Error(data.erreur);
    afficher(data);
  }).catch(e => {
    document.getElementById("message").textContent = "Erreur : " + e.message;
  });
}

function afficher(data) {
try {   // tout échec de rendu doit se voir (jamais une grille silencieusement vide)
  const ref = new Date(data.semaine + "T00:00:00");
  const jours = nomsJours.map((nom, i) => {
    const d = new Date(ref); d.setDate(ref.getDate() + i);
    return { nom, date: d };
  });
  document.getElementById("titreSemaine").textContent =
    jours[0].date.toLocaleDateString("fr-BE", {day:"2-digit", month:"2-digit"}) + " → " +
    jours[6].date.toLocaleDateString("fr-BE", {day:"2-digit", month:"2-digit", year:"2-digit"});

  // Les marqueurs journée entière (Vacances, congés) ne sont pas des cours :
  // ils sortent de la grille et deviennent des pastilles au-dessus de l'en-tête.
  const journeeEntiere = (c) => c.fin && c.debut && c.debut.slice(11, 16) === "00:00"
    && c.fin.slice(11, 16) === "00:00" && (new Date(c.fin) - new Date(c.debut)) >= 86400000
    && !isNaN(new Date(c.debut)) && !isNaN(new Date(c.fin));
  const grilleMarqueurs = [];
  const parJour = [[], [], [], [], [], [], []];
  for (const c of (data.cours || [])) {
    try {
      const dtmp = new Date(c.debut);
      if (isNaN(dtmp)) throw 0;              // événement illisible : ignoré, pas de crash
      if (journeeEntiere(c)) { grilleMarqueurs.push(c); continue; }
      parJour[(dtmp.getDay() + 6) % 7].push(c);
    } catch (e) { /* événement illisible : ignoré */ }
  }
  const bandeMarqueurs = grilleMarqueurs.length
    ? '<div class="horsJours">' + grilleMarqueurs.map(c => {
        // formatage depuis la chaîne ISO (déjà en heure locale) : aucun décalage de fuseau
        const fmt = (iso) => iso.slice(8, 10) + "/" + iso.slice(5, 7) + "/" + iso.slice(2, 4);
        return "<span class='horsJour'>📌 " + echapper(c.matiere) + " : du " + fmt(c.debut)
             + " au " + fmt(c.fin) + "</span>";
      }).join("") + "</div>"
    : "";

  const grille = document.getElementById("grille");
  grille.innerHTML =
    bandeMarqueurs +
    '<div class="entete"><div></div>' + jours.map(j => {
      const complet = j.date.toLocaleDateString("fr-BE", {day:"numeric", month:"long", year:"numeric"});
      const pose = fmtDate(j.date) === fmtDate(new Date()) ? " aujourdhui" : "";
      return "<div class='entete-j" + pose + "'>" + j.nom + "<small>" + complet + "</small></div>";
    }).join("") +
    '</div><div class="corps"><div class="colHeures">' +
    Array.from({length: HEURE_FIN - HEURE_DEBUT + 1}, (_, i) =>
      '<div class="hLab" style="top:' + (i*PX_PAR_HEURE) + 'px">' +
      String(HEURE_DEBUT + i).padStart(2,"0") + ":00</div>").join("") +
    "</div>" +
    jours.map(() => '<div class="col"></div>').join("") +
    "</div>";

  const colonnes = grille.querySelectorAll(".col");
  for (const col of colonnes) {
    for (let i = 1; i < HEURE_FIN - HEURE_DEBUT; i++) {
      const l = document.createElement("div");
      l.className = "ligne";
      l.style.top = (i * PX_PAR_HEURE) + "px";
      col.appendChild(l);
    }
  }

  const legendes = new Map();
  let total = 0;
  for (let j = 0; j < 7; j++) {
    const liste = parJour[j].sort((a, b) => a.debut.localeCompare(b.debut));
    const bornes = liste.map(c => {
      const d = new Date(c.debut), f = new Date(c.fin);
      const mD = Math.max(d.getHours()*60 + d.getMinutes(), HEURE_DEBUT*60);
      const mF = Math.max(Math.min(f.getHours()*60 + f.getMinutes(), HEURE_FIN*60), mD + 15);
      c.mD = mD; c.mF = mF; return c;
    });
    const colonnesLibres = [];
    for (const c of bornes) {
      let idx = colonnesLibres.findIndex(fin => fin <= c.mD);
      if (idx === -1) { colonnesLibres.push(c.mF); idx = colonnesLibres.length - 1; }
      else colonnesLibres[idx] = c.mF;
      c.col = idx;
    }
    let i = 0;
    while (i < bornes.length) {
      let finGroupe = bornes[i].mF, k = i + 1;
      while (k < bornes.length && bornes[k].mD < finGroupe) { finGroupe = Math.max(finGroupe, bornes[k].mF); k++; }
      const nbColsGroupe = Math.max(...bornes.slice(i, k).map(b => b.col)) + 1;
      for (let m = i; m < k; m++) bornes[m].nbCols = nbColsGroupe;
      i = k;
    }
    for (const c of bornes) try {
      const el = document.createElement("div");
      el.className = "cours";
      const intitule = c.intitule || (c.matiere.split(" - ")[0] || c.matiere);
      const couleurB = couleur(intitule) ;
      el.style.background = fondCouleur(couleurB);
      el.style.borderLeft = "4px solid " + couleurB;
      el.style.top = topPx(c.mD) + "px";
      el.style.height = Math.max(topPx(c.mF) - topPx(c.mD) - 2, 18) + "px";
      const part = "(100% - 8px) / " + c.nbCols;
      el.style.left = "calc(4px + " + c.col + " * " + part + ")";
      el.style.width = "calc(" + part + ")";
      const ens = c.enseignants && c.enseignants.length ? c.enseignants.join(", ") : "";
      // type en BAS de la case ; repère rouge pour les évaluations
      const repere = c.type === "Examen" || c.type === "Exercices cotés";
      el.innerHTML =
        "<b>" + echapper(intitule) + "</b>" +
        (c.code ? '<span class="code">' + echapper(c.code) + "</span> " : "") +
        '<span class="h">' + c.debut.slice(11,16) + "–" + c.fin.slice(11,16) + "</span>" +
        (c.duree_min ? ' <span class="h">(' + dureeTexte(c) + ")</span>" : "") +
        (c.salle ? '<span class="salle"> ' + echapper(c.salle.split(",")[0]) + "</span>" : "") +
        (ens ? '<span class="ens"> ' + echapper(ens) + "</span>" : "") +
        (c.memo ? '<span class="memo">📝 ' + echapper(c.memo) + "</span>" : "") +
        '<span class="typeBas' + (repere ? " repere" : "") + '">' + echapper(c.type || "Cours") + "</span>";
      el.onclick = () => montrerFiche(c, intitule);
      colonnes[j].appendChild(el);
      total++;
      if (!legendes.has(intitule)) legendes.set(intitule, couleurB);
    } catch (e) { console.warn("case de cours illisible ignorée", e); }
  }

  const legende = document.getElementById("legende");
  legende.innerHTML = "";
  const maxi = 14;
  let n = 0;
  for (const [intitule, col] of legendes) {
    if (n++ >= maxi) break;
    const item = document.createElement("span");
    item.className = "legende-item";
    item.innerHTML = '<span class="legende-puce" style="background:' + col + '"></span>' + echapper(intitule);
    legende.appendChild(item);
  }
  if (legendes.size > maxi) {
    legende.appendChild(document.createTextNode("+" + (legendes.size - maxi) + " autres cours"));
  }

  const maintenant = new Date();
  const idx = (maintenant.getDay() + 6) % 7;
  const minute = maintenant.getHours()*60 + maintenant.getMinutes();
  if (fmtDate(lundiDe(maintenant)) === data.semaine && minute >= HEURE_DEBUT*60 && minute <= HEURE_FIN*60) {
    const m = document.createElement("div");
    m.className = "marqueur";
    m.style.top = topPx(minute) + "px";
    m.style.left = "calc(52px + " + idx + " * (100% - 52px) / 7)";
    m.style.width = "calc((100% - 52px) / 7)";
    grille.querySelector(".corps").appendChild(m);
  }

  const badge = document.getElementById("badgeSource");
  const horsFenetre = data.fenetre && (ref < new Date(data.fenetre.debut + "T00:00:00") || ref > new Date(data.fenetre.fin + "T23:59:59"));
  if (horsFenetre && data.source === "annuel") {
    badge.style.display = "";
    badge.textContent = "📅 année complète (flux annuel)";
  } else if (horsFenetre && data.source === "archive") {
    badge.style.display = "";
    badge.textContent = "📁 semaine archivée";
  } else if (horsFenetre && total === 0) {
    badge.style.display = "";
    badge.textContent = "⛔ jamais publiée";
  } else {
    badge.style.display = "none";
  }
  document.getElementById("message").textContent = total === 0
    ? (horsFenetre
        ? "Aucune donnée enregistrée pour cette semaine (elle n'a jamais été publiée ni capturée ; le serveur UMONS ne publie que ~3 semaines glissantes — la passe annuelle du serveur la récupérera automatiquement)."
        : "Aucun cours cette semaine pour cette sélection.")
    : "";
  if (vueAnneeActive) majVueAnnee();          // la vue année suit la sélection
} catch (err) {
  // jamais une grille silencieusement vide : toujours un message lisible
  const m = document.getElementById("message");
  if (m) m.textContent = "Erreur d'affichage de la semaine : " + (err && err.message || err);
  try { console.error("afficher()", err); } catch (e2) {}
  if (vueAnneeActive) majVueAnnee();          // la vue année suit la sélection
}
}

// ---------- Vue année (dézoom, ou bouton « Année ») ----------
let vueAnneeActive = false;
let vueAnneeAuto = false;                    // déclenchée par le dézoom

function enVueDezoome() {
  // zoom-out navigateur : le viewport CSS grandit pendant que devicePixelRatio
  // descend sous 1 — les deux ensemble distinguent un dézoom d'un grand écran
  return window.innerWidth >= 1900 && (window.devicePixelRatio || 1) < 1.05;
}
function parametresVue(u) {
  const type = document.getElementById("categorie").value;
  const ressource = document.getElementById("ressource").value;
  const groupe = document.getElementById("groupe").value;
  const filtre = document.getElementById("filtre").value.trim();
  if (type && ressource) {
    u.searchParams.set("type", type === "formations" ? "formation" : "salle");
    u.searchParams.set("ressource", ressource);
  }
  if (groupe) u.searchParams.set("groupe", groupe);
  if (filtre) u.searchParams.set("filtre", filtre);
  return u;
}
function entrerVueAnnee(auto) {
  vueAnneeActive = true;
  if (auto) vueAnneeAuto = true;
  document.getElementById("grille").style.display = "none";
  document.getElementById("message").style.display = "none";
  majVueAnnee();
}
function fermerVueAnnee() {
  // ferme la vue année SANS recharger la grille (retour visuel)
  vueAnneeActive = false;
  vueAnneeAuto = false;
  document.getElementById("grille").style.display = "";
  document.getElementById("message").style.display = "";
  document.getElementById("vueAnnee").classList.remove("actif");
}
function quitterVueAnnee() {
  fermerVueAnnee();
  charger();
}
async function majVueAnnee() {
  if (!vueAnneeActive) return;
  const v = document.getElementById("vueAnnee");
  v.classList.add("actif");
  v.innerHTML = "<p style='color:#777'>Chargement de la vue année…</p>";
  try {
    const r = await fetch(parametresVue(new URL("/api/semaines", location)));
    const data = await r.json();
    if (!data.nombre || !(data.semaines || []).length) {
      v.innerHTML = "<p style='color:#777'>Aucune semaine disponible pour cette sélection.</p>";
      return;
    }
    const parLundi = new Map(data.semaines.map(s => [s.debut, s.cours]));
    const lundiCour = fmtDate(lundi);
    const dernier = new Date(data.derniere + "T00:00:00");
    const curseur = new Date(data.premiere + "T00:00:00");
    curseur.setDate(curseur.getDate() - curseur.getDay() + 1);   // lundi de ce mois
    let html = "";
    while (curseur <= dernier) {
      const mois = curseur.getMonth();
      const nomMois = curseur.toLocaleDateString("fr-BE", { month: "long", year: "numeric" });
      let lignes = "";
      do {
        const iso = fmtDate(curseur);
        const nb = parLundi.get(iso) || 0;
        lignes += "<div class='semCell" + (nb ? "" : " vide") + (iso === lundiCour ? " courante" : "") +
                  "' data-lundi='" + iso + "' title='Aller à cette semaine'>" +
                  "<span>semaine du " + curseur.toLocaleDateString("fr-BE", { day: "2-digit", month: "2-digit", year: "2-digit" }) + "</span>" +
                  "<span class='nb'>" + nb + "</span></div>";
        curseur.setDate(curseur.getDate() + 7);
      } while (curseur.getMonth() === mois && curseur <= dernier);
      html += "<div class='mois'><h4>" + nomMois + "</h4>" + lignes + "</div>";
    }
    v.innerHTML = html;
    v.querySelectorAll(".semCell").forEach(c => {
      c.onclick = () => {
        lundi = new Date(c.dataset.lundi + "T00:00:00");
        quitterVueAnnee();
      };
    });
  } catch (e) {
    v.innerHTML = "<p style='color:#a00'>Erreur vue année : " + e.message + "</p>";
  }
}
document.getElementById("anneeBtn").onclick = () => {
  if (vueAnneeActive) quitterVueAnnee();
  else entrerVueAnnee(false);
};
// bouton « ⚙ Options » : rouvrir l'écran de choix pour changer la
// formation/groupe mémorisés par défaut (présélection de l'actuel) ;
// on referme d'abord la vue année sans recharger (sinon grille cachée au retour)
document.getElementById("changerPref").onclick = () => {
  if (vueAnneeActive) fermerVueAnnee();
  ouvrirAccueil(lirePreference());
};
if (window.addEventListener) window.addEventListener("resize", () => {
  if (!vueAnneeActive && enVueDezoome()) entrerVueAnnee(true);
  else if (vueAnneeActive && vueAnneeAuto && !enVueDezoome()) quitterVueAnnee();
});

  fiche.innerHTML =

    "<h3>" + echapper(intitule) + "</h3>" +
    '<div class="code">' + (c.code ? echapper(c.code) : "code du cours non fourni par l’export") + "</div>" +
    "<dl>" +
    "<dt>Horaire</dt><dd>" + c.debut.slice(11,16) + " – " + c.fin.slice(11,16) +

    "<dt>Local</dt><dd>" + echapper(c.salle || "—") + "</dd>" +

      : "<dt>Groupe(s)</dt><dd>aucun attribué — cours commun (affiché pour tous les groupes)</dd>") +
    (c.formations && c.formations.length ? "<dt>Formation(s)</dt><dd>" + echapper(c.formations.map(f => f.replace(/^\./, "")).join(", ")) + "</dd>" : "") +

document.getElementById("flux").value = lireFlux();

// ---------- Écran de choix : formation + groupe, mémorisé en cookies ----------
// Deux écrans : sans cookie, la page de choix est affichée SEULE (l'horaire
// est masqué) ; avec cookie, atterrissage direct sur le bon horaire.
const JOURS_COOKIE = 365;
function ecrireCookie(nom, valeur) {
  try {
    document.cookie = nom + "=" + encodeURIComponent(valeur) + "; path=/; max-age="
      + (JOURS_COOKIE * 86400) + "; SameSite=Lax";
  } catch (e) {}
}
function lireCookie(nom) {
  try {
    const m = document.cookie.match(new RegExp("(?:^|; )" + nom + "=([^;]*)"));
    return m ? decodeURIComponent(m[1]) : "";
  } catch (e) { return ""; }
}
function lirePreference() {
  const res = lireCookie("hp_ressource");
  if (!res) return null;
  return { categorie: lireCookie("hp_categorie") || "formations",
           ressource: res, groupe: lireCookie("hp_groupe") };
}

async function appliquerPreference(pref) {
  // met les sélecteurs de la page sur la préférence mémorisée ; renvoie false
  // si la ressource n'existe plus (formation retirée du catalogue)
  const cath = pref.categorie === "salles" ? "salles" : "formations";
  document.getElementById("categorie").value = cath;
  document.getElementById("recherche").style.display = cath ? "" : "none";
  majListeRessources();
  const sel = document.getElementById("ressource");
  if (![...sel.options].some(o => o.value === pref.ressource)) {
    ecrireCookie("hp_ressource", "");
    ecrireCookie("hp_groupe", "");
    return false;
  }
  sel.value = pref.ressource;
  document.getElementById("flux").value = lireFlux();
  await majGroupesPourRessource();
  if (pref.groupe) {
    const g = document.getElementById("groupe");
    if ([...g.options].some(o => o.value === pref.groupe)) g.value = pref.groupe;
    else ecrireCookie("hp_groupe", "");
  }
  return true;
}

function classeChoix(on) {
  try { document.body.classList.toggle("choix", !!on); } catch (e) {}
}
function montrerHoraires() {
  classeChoix(false);
  document.getElementById("accueil").style.display = "none";
  const v = document.getElementById("voile");
  v.classList.remove("plein");
  v.style.display = "none";
}
async function ouvrirAccueil(pref) {
  // écran d'entrée / de modification : choix formation + groupe, mémorisé
  // dans les cookies ; en mode « choix » (body.choix) l'en-tête et la grille
  // sont masqués.
  const modif = Boolean(pref && pref.ressource);
  classeChoix(true);
  const box = document.getElementById("accueil");
  box.innerHTML =
    "<h2>" + (modif ? "Changer votre formation / votre groupe" : "Bienvenue sur votre emploi du temps UMONS") + "</h2>" +
    "<p style='font-size:13px;color:#555;margin:4px 0 2px'>" + (modif
      ? "Choisissez une autre formation ou un autre groupe de TP ; « Enregistrer et afficher » en fait votre choix par défaut. « Annuler » garde la sélection actuelle."
      : "Choisissez votre formation (et au besoin votre groupe de TP) ; l'information est mémorisée dans les cookies et votre horaire s'ouvrira automatiquement aux prochaines visites.") + "</p>" +
    "<label>Formation</label><select id='accFormation'></select>" +
    "<label>Groupe (TP)</label><select id='accGroupe'><option value=''>Tous les groupes</option></select>" +
    "<div class='boutons'><button id='accAnnule' class='second'" + (modif ? "" : " style='display:none'") + ">Annuler</button><button id='accTout' class='second'>Tout afficher</button><button id='accOk'>Enregistrer et afficher</button></div>";
  const selF = box.querySelector("#accFormation");
  for (const f of (catalogue.formations || [])) {
    const o = document.createElement("option"); o.value = f.valeur; o.textContent = f.affichage; selF.appendChild(o);
  }
  if (pref && pref.ressource && [...selF.options].some(o => o.value === pref.ressource)) selF.value = pref.ressource;
  const selG = box.querySelector("#accGroupe");
  const majGroupesAccueil = async () => {
    selG.innerHTML = "<option value=''>Tous les groupes</option>";
    if (!selF.value) return;
    try {
      const r = await fetch(new URL("/api/ressources?type=formation&ressource=" + encodeURIComponent(selF.value), location));
      const data = await r.json();
      for (const g of (data.groupes || [])) {
        const o = document.createElement("option"); o.value = g.valeur; o.textContent = g.affichage; selG.appendChild(o);
      }
      if (pref && pref.groupe && [...selG.options].some(o => o.value === pref.groupe)) selG.value = pref.groupe;
    } catch (e) { /* repli : tous les groupes */ }
  };
  await majGroupesAccueil();
  selF.onchange = async () => { if (pref) pref.groupe = ""; await majGroupesAccueil(); };
  box.style.display = "block";
  const v = document.getElementById("voile");
  v.classList.add("plein");
  v.style.display = "block";
  const lancer = (memoriser) => {
    if (memoriser) {
      ecrireCookie("hp_categorie", "formations");
      ecrireCookie("hp_ressource", selF.value);
      ecrireCookie("hp_groupe", selG.value);
    }
    montrerHoraires();
    appliquerPreference({ categorie: "formations", ressource: selF.value, groupe: selG.value })
      .then(() => charger());
  };
  box.querySelector("#accOk").onclick = () => lancer(true);
  box.querySelector("#accTout").onclick = () => lancer(false);
  const annule = box.querySelector("#accAnnule");
  if (annule) annule.onclick = () => montrerHoraires();     // garder la sélection actuelle
}

(async () => {
  chargerRessources();
  // le catalogue (formations/salles/groupes) arrive via /api/ressources
  const attendreCatalogue = async () => {
    const t0 = Date.now();
    while (!(catalogue.formations || []).length && Date.now() - t0 < 30000)
      await new Promise(r => setTimeout(r, 300));
  };
  const pref = lirePreference();
  if (pref) {
    // visite suivante : atterrissage direct sur le bon horaire (pas d'écran
    // de choix), la grille reste masquée jusqu'à ce que la sélection soit posée
    await attendreCatalogue();
    const ok = await appliquerPreference(pref);
    if (ok) {
      montrerHoraires();
      charger();
      return;
    }
    document.getElementById("accueil").innerHTML = "";   // ressource disparue
  }
  // première visite (ou préférence invalide) : page de choix obligatoire
  await attendreCatalogue();
  await ouvrirAccueil(pref);
})();
