# App personnalisée TrueNAS SCALE (Electric Eel 24.10+ : Apps → Discover → ⋮ → Install via YAML)
# Fonctionne aussi en direct : docker compose up -d
# ATTENTION TrueNAS : le champ App Name doit être en minuscules (ex. horaire-umons)
name: horaire-umons
services:
  horaire-umons:
    # Image officielle publique : aucun build ni registre privé requis.
    # Le code est récupéré depuis ce dépôt GitHub au premier démarrage seulement.
    image: python:3.12-slim
    container_name: horaire-umons
    restart: unless-stopped
    ports:
      - "8080:8000"
    volumes:
      # Persistance de l'archive des semaines (indispensable pour revoir les semaines passées)
      - horaire-donnees:/app/data
    environment:
      HP_HOST: "0.0.0.0"
      HP_PORT: "8000"
      HP_ARCHIVE: "/app/data/archive_horaires.json"
      # Facultatif : URL iCal d'une ressource précise (diplôme, promo, salle, enseignant)
      # HP_URL: "https://hplanning2026.umons.ac.be/ical/xxxx.ics?idICal=...&param=..."
    command: >
      sh -c "apt-get update -qq &&
             apt-get install -y -qq --no-install-recommends git tzdata ca-certificates &&
             rm -rf /var/lib/apt/lists/* &&
             mkdir -p /app/data &&
             if [ ! -f /app/serveur_horaires.py ]; then
               git clone --depth 1 https://github.com/comptedevpourapp-tech/Horairee.git /tmp/src &&
               cp /tmp/src/*.py /tmp/src/*.html /tmp/src/liens_annuels.json /app/ &&
               rm -rf /tmp/src ;
             fi &&
             cd /app &&
             exec python serveur_horaires.py"
volumes:
  horaire-donnees:
