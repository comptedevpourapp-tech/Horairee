# Variante TrueNAS SCALE avec l image pre-construite publiee sur GHCR
# (le workflow GitHub Actions la reconstruit a chaque push sur main)
# Apps -> Discover -> menue (3 points) -> Install via YAML : collez ce fichier.
# ATTENTION TrueNAS : le champ App Name doit etre en minuscules (ex. horaire-umons)
# Demarrage plus rapide et plus leger que la variante clone (docker-compose.yaml) :
# aucun git, aucun apt-get au demarrage, image deja prete.
name: horaire-umons
services:
  horaire-umons:
    image: ghcr.io/comptedevpourapp-tech/horairee:latest
    # force le telechargement de la derniere image a chaque recreation du conteneur
    # (sinon TrueNAS/Docker reutilise l image locale en cache et l update ne change rien)
    pull_policy: always
    container_name: horaire-umons
    restart: unless-stopped
    ports:
      - "8080:8000"
    volumes:
      # Persistance de l'archive des semaines (indispensable pour revoir les semaines passees)
      - horaire-donnees:/app/data
    environment:
      HP_HOST: "0.0.0.0"
      HP_PORT: "8000"
      HP_ARCHIVE: "/app/data/archive_horaires.json"
      # capture de l'horaire toutes les 2 heures pour n'oublier aucune semaine
      CAPTURE_HEURES: "2"
      # flux iCal annuels (toute l'année) tirés du catalogue intégré liens_annuels.json :
      # rafraîchissement des 234 formations publiques toutes les 24 h (0 = désactiver)
      HP_ANNUEL_HEURES: "24"
      # Facultatif : URL iCal d'une ressource precise (diplome, promo, salle, enseignant)
      # HP_URL: "https://hplanning2026.umons.ac.be/ical/xxxx.ics?idICal=...&param=..."
volumes:
  horaire-donnees:
